<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tamago Studio</title>
<meta name="description" content="Tamago Studio makes Highlights, an iPhone app for keeping your favorite photos and sharing them with close friends.">
<style>
  :root { --bg: #F6F9F8; --ink: #142120; --muted: #637472; --accent: #1F6F68; --line: #DFE8E6; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1514; --ink: #E9F1EF; --muted: #93A6A3; --accent: #7CC5BC; --line: #263331; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; background: var(--bg); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { margin: auto; max-width: 560px; padding: 64px 20px; }
  .studio { font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 40px; }
  h1 { font: 600 44px/1.1 "New York", Georgia, serif; margin: 0 0 12px; }
  p { margin: 0 0 16px; }
  .muted { color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
</style>
</head>
<body>
<main>
  <p class="studio">Tamago Studio</p>
  <h1>Highlights</h1>
  <p>An iPhone app for keeping your favorite photos, beautifully, and sharing them with close friends and family when you choose.</p>
  <p class="muted">Private by default. No ads, no likes, no algorithm. Currently in a small test with friends.</p>
  <footer>
    <a href="/privacy/">Privacy Policy</a>
    <a href="/terms/">Terms of Use</a>
    <span class="muted">hello@tamago.studio</span>
  </footer>
</main>
</body>
</html>
